[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mousecortex"
version = "0.1.0"
description = "A cubic millimetre of mouse visual cortex you can attach to anything, and train with reward."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["connectome", "spiking", "neuroscience", "MICrONS", "reinforcement", "dopamine"]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=12.0"]
screen = ["pillow>=10.0", "playwright>=1.40"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
