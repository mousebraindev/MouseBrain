name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: nothing personal ships
        run: python tools/privacy_scan.py
      - run: pytest -q
      - name: the demo has to actually run
        run: >
          python -m cortex.cli demo --neurons 800 --sim-steps 60
          --episodes 3 --eval 2 --max-steps 8
